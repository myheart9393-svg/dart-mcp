[project]
name = "dart-mcp"
version = "0.1.0"
description = "DART (OpenDART) 전자공시 원문 추출 파이프라인 — MCP 서버의 기반 모듈"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "lxml>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dart_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
