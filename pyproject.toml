[project]
name = "dart-mcp"
version = "1.1.0"
description = "OpenDART 공시 원문을 섹션 단위로 읽고 재무 API를 구조화하는 MCP 서버 + 기업분석 슬래시 커맨드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dart_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
